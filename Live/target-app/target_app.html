<!doctype html><html><head><meta charset="utf-8"><title>Pragyaan Demo Shop</title><style>body{font-family:Arial;margin:40px;background:#f5f7fb}.card{background:#fff;padding:24px;border-radius:12px;max-width:800px;margin:auto}.item{border:1px solid #ddd;padding:16px;margin:12px 0}.cart{margin-top:20px;padding:15px;background:#eef}.hidden{display:none}button{padding:10px 15px;margin:5px}input{padding:9px;margin:5px}</style></head><body><div class="card"><h1>Pragyaan Demo Shop</h1><section id="shop"><div class="item"><h2>Laptop</h2><p>₹50,000</p><button aria-label="Add laptop to cart" onclick="add()">Add Laptop</button></div><div class="item"><h2>Mouse</h2><p>₹800</p><button aria-label="Add mouse to cart" onclick="alert('Mouse added')">Add Mouse</button></div></section><section id="cart" class="cart hidden"><h2>Cart</h2><p id="cartText">Laptop added.</p><button onclick="checkout()">Proceed to Checkout</button></section><section id="checkout" class="hidden"><h2>Checkout</h2><label>First name <input aria-label="First name" id="first"></label><br><label>Last name <input aria-label="Last name" id="last"></label><br><label>Postal code <input aria-label="Postal code" id="postal"></label><br><button onclick="place()">Place Order</button></section><section id="done" class="hidden"><h2>Order Confirmation</h2><p>Thank you! Your order has been placed successfully.</p></section></div><script>function add(){shop.classList.add('hidden');cart.classList.remove('hidden')}function checkout(){cart.classList.add('hidden');checkout=document.getElementById('checkout');checkout.classList.remove('hidden')}function place(){document.getElementById('checkout').classList.add('hidden');document.getElementById('done').classList.remove('hidden')}</script></body></html>
